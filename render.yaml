services:
  - type: web
    name: neuroops-backend
    env: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: APP_ENV
        value: production
      - key: CORS_ORIGINS
        sync: false # Set this to your Netlify URL in the Render Dashboard
      - key: GEMINI_API_KEY
        sync: false # Add your Gemini API Key in the Render Dashboard
